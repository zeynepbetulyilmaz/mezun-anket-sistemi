version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mezun_anket_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  backend:
    build: 
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres-db
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=mezun_anket_db
      - ENCRYPTION_KEY=3f8a9b2c1d4e7f605a9c8b7d6e2f1a0b3f8a9b2c1d4e7f605a9c8b7d6e2f1a0b
    depends_on:
      - postgres-db
    restart: always

  frontend:
    build: 
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

volumes:
  pgdata: